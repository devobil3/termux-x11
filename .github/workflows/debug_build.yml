name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - feature/multi-display
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'img/**'
  pull_request:
    branches:
      - master
      - feature/multi-display
    paths-ignore:
      - '**.md'
      - 'img/**'

permissions:
  contents: write
  
jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
    - name: Clone repository
      uses: actions/checkout@v7
      with:
        submodules: false
        fetch-depth: 1
    - name: Validation
      uses: gradle/actions/wrapper-validation@v6

    - name: Java setup
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Restore cache
      uses: actions/cache@v6
      with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .git/modules
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '.gitmodules') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

    - name: Fetch submodules
      run: git submodule update --init --recursive --jobs 8 --depth 1

    - name: Build
      run: ./gradlew assembleDebug
    - name: Build companion package
      run: ./build_termux_package
    - name: Store app-arm64-v8a-debug
      uses: actions/upload-artifact@v7
      with:
        name: termux-x11-arm64-v8a-debug
        path: ./app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
    
    - name: Store app-armeabi-v7a-debug
      uses: actions/upload-artifact@v7
      with:
        name: termux-x11-armeabi-v7a-debug
        path: ./app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
    
    - name: Store app-universal-debug
      uses: actions/upload-artifact@v7
      with:
        name: termux-x11-universal-debug
        path: ./app/build/outputs/apk/debug/app-universal-debug.apk
    
    - name: Store app-x86_64-debug
      uses: actions/upload-artifact@v7
      with:
        name: termux-x11-x86_64-debug
        path: ./app/build/outputs/apk/debug/app-x86_64-debug.apk
    
    - name: Store app-x86-debug
      uses: actions/upload-artifact@v7
      with:
        name: termux-x11-x86-debug
        path: ./app/build/outputs/apk/debug/app-x86-debug.apk
    
    - name: Store companion package
      uses: actions/upload-artifact@v7
      with:
        name: termux-companion packages
        path: |
          ./app/build/outputs/apk/debug/termux-x11-*-all.deb
          ./app/build/outputs/apk/debug/termux-x11-*-any.pkg.tar.xz
        
    - name: Store unstripped libraries with debug symbols
      uses: actions/upload-artifact@v7
      with:
        name: termux-x11-unstripped-libraries-for-ndk-stack
        path: ./app/build/intermediates/cxx/Debug/*

    - name: Generate Release Notes and Checksums
      run: |
        # 1. Calculate SHA-256 Checksums
        CHECKSUMS=$(cd ./app/build/outputs/apk/debug && sha256sum app-*-debug.apk termux-x11-*-all.deb termux-x11-*-any.pkg.tar.xz 2>/dev/null || true)

        # 2. Extract commit title and body
        COMMIT_TITLE=$(git log -1 --format="%s")
        COMMIT_BODY=$(git log -1 --format="%b")

        # 3. Construct release body
        {
          echo "RELEASE_BODY<<EOF"
          echo "## $COMMIT_TITLE"
          echo ""
          if [ -n "$COMMIT_BODY" ]; then
            echo "$COMMIT_BODY"
            echo ""
          fi
          echo "---"
          echo "### Verification (SHA-256 Checksums)"
          echo '```text'
          echo "$CHECKSUMS"
          echo '```'
          echo "EOF"
        } >> $GITHUB_ENV

    - name: Update Nightly Release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature/multi-display' || startsWith(github.ref, 'refs/tags/v'))
      run: |
        if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          TAG_NAME="${{ github.ref_name }}"
          RELEASE_NAME="Release ${{ github.ref_name }}"
        else
          TAG_NAME="nightly-${{ github.sha }}"
          RELEASE_NAME="Nightly Release $(date +'%Y%m%d')"
        fi

        gh release create "$TAG_NAME" \
          --title "$RELEASE_NAME" \
          --notes "$RELEASE_BODY" \
          ./app/build/outputs/apk/debug/app-*-debug.apk \
          ./app/build/outputs/apk/debug/termux-x11-*-all.deb \
          ./app/build/outputs/apk/debug/termux-x11-*-any.pkg.tar.xz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
